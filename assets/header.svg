<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 200" width="1000" height="200"
     role="img" aria-label="Harshit Jantwal — B.Tech CSE, full-stack and systems">
  <defs>
    <radialGradient id="core" cx="35%" cy="30%" r="75%">
      <stop offset="0%"  stop-color="#7dd3fc"/>
      <stop offset="55%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#1e3a5f"/>
    </radialGradient>

    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <style>
      .sans { font-family: "Segoe UI", Inter, Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, "SF Mono", Consolas, monospace; }

      .star { fill:#c9d1d9; animation: tw 4s ease-in-out infinite; }
      .b { animation-delay:-1.3s } .c { animation-delay:-2.6s }
      @keyframes tw { 0%,100% { opacity:.18 } 50% { opacity:.7 } }

      .rule { stroke-dasharray:64; stroke-dashoffset:64; animation: draw 1.2s ease-out forwards; }
      @keyframes draw { to { stroke-dashoffset:0 } }
    </style>
  </defs>

  <rect width="1000" height="200" rx="12" fill="#0d1117"/>
  <rect x="0.5" y="0.5" width="999" height="199" rx="12" fill="none" stroke="#21262d"/>

  <g>
    <circle class="star"   cx="150" cy="38"  r="1.2"/>
    <circle class="star b" cx="326" cy="164" r="1"/>
    <circle class="star c" cx="472" cy="52"  r="1.3"/>
    <circle class="star"   cx="596" cy="148" r="1"/>
    <circle class="star b" cx="666" cy="34"  r="1.1"/>
    <circle class="star c" cx="960" cy="170" r="1.2"/>
    <circle class="star"   cx="60"  cy="172" r="1"/>
  </g>

  <!-- orbital system -->
  <g transform="translate(828 100)">
    <circle r="88" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.22"/>
    <circle r="58" fill="none" stroke="#8b949e" stroke-width="1" opacity="0.14" stroke-dasharray="3 6">
      <animateTransform attributeName="transform" type="rotate"
                        from="0" to="360" dur="24s" repeatCount="indefinite"/>
    </circle>

    <circle r="24" fill="url(#core)" filter="url(#soft)"/>

    <circle r="3.5" fill="#7dd3fc">
      <animateMotion dur="11s" repeatCount="indefinite"
                     path="M 0,-88 a 88,88 0 1,1 0,176 a 88,88 0 1,1 0,-176"/>
    </circle>
  </g>

  <!-- identity -->
  <g>
    <path class="rule" d="M56 46 H120" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>

    <text class="sans" x="56" y="100" font-size="38" font-weight="700"
          letter-spacing="0.5" fill="#e6edf3">Harshit Jantwal</text>

    <text class="mono" x="57" y="130" font-size="14.5" fill="#8b949e" letter-spacing="0.3">
      B.Tech CSE &#183; full-stack &amp; systems &#183; @Harshcodes04
    </text>

    <text class="mono" x="57" y="158" font-size="13" fill="#58a6ff" letter-spacing="0.3">
      building things that point at the sky
    </text>
  </g>
</svg>
